# Local infrastructure for development without Aspire:
#   docker compose -f deploy/docker-compose.dev.yml up -d
# then run the services (see docs/07-installation.md). Ports are fixed and match appsettings.Development.json.
name: smartshop-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [dev-postgres:/var/lib/postgresql/data]

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672"]

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    # Same S3 identity as appsettings.Development.json (smartshop / smartshop).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"smartshop","credentials":[{"accessKey":"smartshop","secretKey":"smartshop"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec /usr/bin/weed -logtostderr=true server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256 -s3 -s3.config=/tmp/s3.json
    ports: ["8333:8333"]
    volumes: [dev-seaweedfs:/data]

volumes:
  dev-postgres:
  dev-seaweedfs:
