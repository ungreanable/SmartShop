# Optional observability stack: traces, metrics and logs from api / worker / web via OpenTelemetry.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana (with Tempo, Prometheus/Mimir and Loki pre-wired) listens on 127.0.0.1:3000 only.
# Reach it through an SSH tunnel:  ssh -L 3000:localhost:3000 you@server   then open http://localhost:3000
# Default login admin / admin: change it on first sign-in.

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - otel-lgtm-data:/data
    environment:
      GF_PATHS_DATA: /data/grafana

  api:
    environment: *otel
    depends_on: [otel-lgtm]

  worker:
    environment: *otel
    depends_on: [otel-lgtm]

  web:
    environment: *otel
    depends_on: [otel-lgtm]

volumes:
  otel-lgtm-data:
