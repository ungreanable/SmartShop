# Run behind a reverse proxy you already have on the server (e.g. Nginx with Cloudflare in front).
# Caddy then only routes /api, /hubs and the web app over plain HTTP on 127.0.0.1; your proxy does HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml up -d
#
# In .env: CADDY_SITE=:80 and (optional) SMARTSHOP_HTTP_PORT=8088
# Nginx example: deploy/nginx/smartshop.conf · Guide: docs/08-cloudflare.md

services:
  caddy:
    ports: !override
      - "127.0.0.1:${SMARTSHOP_HTTP_PORT:-8088}:80"
