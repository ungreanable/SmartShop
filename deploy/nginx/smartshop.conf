# SmartShop behind Nginx + Cloudflare (proxied / orange cloud, SSL mode "Full (strict)").
# Copy to /etc/nginx/sites-available/smartshop.conf, adjust server_name and certificate paths, then:
#   sudo ln -s /etc/nginx/sites-available/smartshop.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# SmartShop itself listens on 127.0.0.1:8088 (docker-compose.behind-proxy.yml); Caddy there already compresses
# responses, so gzip is not repeated here.

# WebSocket upgrade for SignalR (/hubs/realtime); an empty value keeps normal requests on pooled keep-alive connections.
# Skip if your nginx.conf already defines $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Reuse connections to SmartShop instead of opening a new TCP connection per request.
upstream smartshop {
    server 127.0.0.1:8088;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.ungrean.com;
    return 301 https://$host$request_uri;
}

server {
    # Works on every Nginx version (Ubuntu 22.04 = 1.18, 24.04 = 1.24). On Nginx >= 1.25.1 you may instead write
    # "listen 443 ssl;" + "http2 on;". Use the same listen options as your other sites on 443.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.ungrean.com;

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server → Create certificate), valid up to 15 years.
    ssl_certificate     /etc/ssl/cloudflare/ungrean.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ungrean.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cloudflare keeps few, long-lived connections to the origin: resuming sessions saves a handshake each time.
    ssl_session_cache shared:SmartShopSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Slips and product photos (the app limits single files to 15 MB, PDF 5 MB).
    client_max_body_size 20m;
    # Typical phone photo fits in memory; bigger bodies spill to a temp file instead of tying up RAM.
    client_body_buffer_size 1m;
    client_body_timeout 60s;

    # Errors produced by Nginx itself (not by SmartShop) as JSON, so the app can tell the user what happened.
    error_page 413 = @too_large;
    error_page 502 504 = @unavailable;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Cloudflare's header with the visitor's IP; SmartShop uses it for rate limiting.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;

    # SignalR (real-time orders) keeps a WebSocket open for a long time; never buffer it.
    location /hubs/ {
        proxy_pass http://smartshop;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Uploads: Nginx receives the whole file first (slow mobile networks), then hands it to SmartShop in one go,
    # so an upload never holds an app connection for minutes.
    location = /api/media {
        proxy_pass http://smartshop;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Pages, API and static files.
    location / {
        proxy_pass http://smartshop;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
    }

    location @too_large {
        default_type application/problem+json;
        return 413 '{"status":413,"code":"media_too_large","title":"The file is too large (pictures up to 15 MB, PDF up to 5 MB)."}';
    }

    location @unavailable {
        default_type application/problem+json;
        add_header Retry-After 5 always;
        return 503 '{"status":503,"code":"server_unavailable","title":"SmartShop is restarting or busy. Please try again in a moment."}';
    }
}
