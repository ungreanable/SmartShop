# SmartShop behind Nginx + Cloudflare (proxied / orange cloud, SSL mode "Full (strict)").
# Copy to /etc/nginx/sites-available/smartshop.conf, adjust server_name and certificate paths, then:
#   sudo ln -s /etc/nginx/sites-available/smartshop.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# SmartShop itself listens on 127.0.0.1:8088 (docker-compose.behind-proxy.yml).

# WebSocket upgrade for SignalR (/hubs/realtime) - skip if your nginx.conf already defines $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.ungrean.com;
    return 301 https://$host$request_uri;
}

server {
    # Works on every Nginx version (Ubuntu 22.04 = 1.18, 24.04 = 1.24). On Nginx >= 1.25.1 you may instead write
    # "listen 443 ssl;" + "http2 on;". Use the same listen options as your other sites on 443.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.ungrean.com;

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server → Create certificate), valid up to 15 years.
    ssl_certificate     /etc/ssl/cloudflare/ungrean.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ungrean.com.key;

    # Slips and product photos (the app limits single files to 15 MB).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Cloudflare's header with the visitor's IP; SmartShop uses it for rate limiting.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

        # SignalR (real-time orders) keeps a WebSocket open.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
