{{- if .Values.ingress.enabled }}
# Everything goes to the web host, which serves the PWA and proxies /api and /hubs (WebSockets) to the API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smartshop.fullname" . }}
  labels: {{ include "smartshop.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "smartshop.fullname" . }}-web
                port: { name: http }
{{- end }}
