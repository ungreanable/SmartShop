{{- $component := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartshop.fullname" . }}-api
  labels:
    {{- include "smartshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{ include "smartshop.selector" $component | nindent 6 }}
  template:
    metadata:
      labels: {{ include "smartshop.selector" $component | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "smartshop.podSpecCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "smartshop.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "smartshop.appEnv" . | nindent 12 }}
            - name: Messaging__Role
              value: Api
            # Migrations run in the hook Job, not on every pod start.
            - name: Database__MigrateOnStartup
              value: "false"
          {{- include "smartshop.probes" . | nindent 10 }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartshop.fullname" . }}-api
  labels: {{ include "smartshop.labels" . | nindent 4 }}
spec:
  selector: {{ include "smartshop.selector" $component | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "smartshop.fullname" . }}-api
  labels: {{ include "smartshop.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "smartshop.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
