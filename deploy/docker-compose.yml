# SmartShop production stack for a single VPS.
#   cp .env.example .env   # then edit secrets
#   docker compose up -d
# Only Caddy is exposed to the internet; everything else stays on the internal network.
name: smartshop

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Production}"
  Auth__DevLogin__Enabled: "${DEV_LOGIN_ENABLED:-false}"
  ConnectionStrings__smartshop: "Host=postgres;Database=smartshop;Username=smartshop;Password=${POSTGRES_PASSWORD}"
  ConnectionStrings__cache: "valkey:6379"
  ConnectionStrings__rabbitmq: "amqp://smartshop:${RABBITMQ_PASSWORD}@rabbitmq:5672"
  Auth__Jwt__SigningKey: "${JWT_SIGNING_KEY}"
  Media__SigningKey: "${MEDIA_SIGNING_KEY}"
  Auth__Line__ChannelId: "${LINE_LOGIN_CHANNEL_ID}"
  Auth__Line__ChannelSecret: "${LINE_LOGIN_CHANNEL_SECRET}"
  Auth__Line__LiffId: "${LINE_LIFF_ID}"
  Line__MessagingChannelAccessToken: "${LINE_MESSAGING_ACCESS_TOKEN}"
  Line__MessagingChannelSecret: "${LINE_MESSAGING_CHANNEL_SECRET}"
  Line__MonthlyQuota: "${LINE_MONTHLY_QUOTA:-300}"
  Line__AddFriendUrl: "${LINE_ADD_FRIEND_URL:-}"
  Firebase__CredentialsJson: "${FIREBASE_CREDENTIALS_JSON:-}"
  Identity__SystemAdminLineUserIds__0: "${SYSTEM_ADMIN_LINE_USER_ID}"
  WebPush__Subject: "mailto:${ADMIN_EMAIL}"
  WebPush__PublicKey: "${VAPID_PUBLIC_KEY}"
  WebPush__PrivateKey: "${VAPID_PRIVATE_KEY}"
  Storage__Provider: S3
  Storage__ServiceUrl: "http://seaweedfs:8333"
  Storage__Bucket: smartshop
  Storage__AccessKey: "${STORAGE_ACCESS_KEY}"
  Storage__SecretKey: "${STORAGE_SECRET_KEY}"
  App__PublicUrl: "https://${DOMAIN}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  Database__RowLevelSecurity: "${DATABASE_ROW_LEVEL_SECURITY:-false}"
  Payments__SlipVerifier__Url: "${SLIP_VERIFIER_URL:-}"
  Payments__SlipVerifier__ApiKey: "${SLIP_VERIFIER_API_KEY:-}"
  Payments__SlipVerifier__AutoConfirm: "${SLIP_VERIFIER_AUTO_CONFIRM:-false}"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      # Site address: the domain (automatic HTTPS) or http://<domain> behind a Cloudflare Tunnel.
      CADDY_SITE: "${CADDY_SITE:-${DOMAIN}}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-private_ranges}"
      # e.g. "tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key" for a Cloudflare Origin Certificate
      TLS_DIRECTIVE: "${TLS_DIRECTIVE:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/ungreanable}/smartshop-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Production}"
      Auth__DevLogin__Enabled: "${DEV_LOGIN_ENABLED:-false}"
      ReverseProxy__Clusters__api__Destinations__api__Address: "http://api:8080"
      # Public client settings served at /app-config.json
      Auth__Line__ChannelId: "${LINE_LOGIN_CHANNEL_ID}"
      Auth__Line__LiffId: "${LINE_LIFF_ID}"
      Line__AddFriendUrl: "${LINE_ADD_FRIEND_URL:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/ungreanable}/smartshop-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      Messaging__Role: Api
    healthcheck:
      test: ["CMD", "dotnet", "SmartShop.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrator: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/ungreanable}/smartshop-worker:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "dotnet", "SmartShop.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      migrator: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Applies EF Core migrations of every module, then exits.
  migrator:
    image: ${IMAGE_PREFIX:-ghcr.io/ungreanable}/smartshop-api:${TAG:-latest}
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *app-env
      Messaging__Role: Standalone
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop -d smartshop"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: smartshop
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  # S3-compatible storage. Not exposed: only the API/worker talk to it, media is served through signed API URLs.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    # The S3 gateway only accepts signed requests from the identity in s3.json, written from .env at start.
    environment:
      S3_ACCESS_KEY: "${STORAGE_ACCESS_KEY}"
      S3_SECRET_KEY: "${STORAGE_SECRET_KEY}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"smartshop","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec /usr/bin/weed -logtostderr=true server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.config=/tmp/s3.json
    volumes: [seaweedfs-data:/data]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  seaweedfs-data:
