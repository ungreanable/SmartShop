<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmartShop</title>
    <base href="/" />
    <!-- Link previews stay generic on purpose: shops are only visible to members of their village. -->
    <meta name="description" content="SmartShop - ร้านค้าในหมู่บ้าน สั่งง่าย รู้สถานะทุกออเดอร์" />
    <meta property="og:title" content="SmartShop" />
    <meta property="og:description" content="เปิดดูใน SmartShop (เฉพาะสมาชิกหมู่บ้าน)" />
    <meta property="og:image" content="icons/og.png" />
    <meta name="theme-color" content="#00A851" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/SmartShop.UI/css/app.css" rel="stylesheet" />
    <style>
        #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #00A851; background: #F6F7F9; }
        #app-loading .ring { width: 48px; height: 48px; border: 4px solid #CDEFDC; border-top-color: #00A851; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div id="app-loading"><div class="ring"></div><div>SmartShop</div></div>
    </div>
    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; right:0; padding:12px; background:#FFE3E3; z-index:2000">
        เกิดข้อผิดพลาด / An error occurred. <a href="" class="reload">โหลดใหม่ / Reload</a>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/SmartShop.UI/js/smartshop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // A new version's service worker takes over immediately; files already loaded by the old one (like
            // smartshop.js) would then mix with the new app. Reload once so everything comes from one version.
            const hadController = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloading) return;
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
