version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      aspnetcore:
        patterns: ["Microsoft.*", "System.*"]
      aspire:
        patterns: ["Aspire.*"]
      wolverine:
        patterns: ["WolverineFx*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
