name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartShop.slnx

      - name: Format check
        run: dotnet format SmartShop.slnx --verify-no-changes --no-restore --severity error

      - name: Build
        run: dotnet build SmartShop.slnx --no-restore -c Release

      - name: Razor component parameter check
        run: dotnet run scripts/check-razor-params.cs -- src/Clients/SmartShop.UI

      - name: Unit & architecture tests
        run: |
          dotnet test --project tests/SmartShop.UnitTests -c Release --no-build
          dotnet test --project tests/SmartShop.ArchitectureTests -c Release --no-build

      - name: Integration tests (Testcontainers)
        run: dotnet test --project tests/SmartShop.IntegrationTests -c Release --no-build

  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install MAUI workload
        run: dotnet workload install maui-android
      - name: Build Android app
        run: dotnet build src/Clients/SmartShop.Mobile -f net10.0-android -c Release

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint & render
        run: |
          helm lint deploy/helm/smartshop
          helm template ci deploy/helm/smartshop --set api.autoscaling.enabled=true > /dev/null
      - name: Compose config
        working-directory: deploy
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.observability.yml config -q

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Reject copyleft / commercial NuGet licenses
        run: bash scripts/check-licenses.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0, BUSL-1.1
