name: CI

# Pull requests and branches run CI here. Pushes to main and release tags run it through the Containers
# workflow (workflow_call), which publishes images only when every CI job passed.
on:
  push:
    branches-ignore: [main, "dependabot/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SmartShop.slnx

      - name: Build
        run: dotnet build SmartShop.slnx --no-restore -c Release

      - name: Razor component parameter check
        run: dotnet run scripts/check-razor-params.cs -- src/Clients/SmartShop.UI

      - name: Unit & architecture tests
        run: |
          dotnet test --project tests/SmartShop.UnitTests -c Release --no-build
          dotnet test --project tests/SmartShop.ArchitectureTests -c Release --no-build

      - name: Integration tests (Testcontainers)
        run: dotnet test --project tests/SmartShop.IntegrationTests -c Release --no-build

  # Separate job so the analyzer-heavy format check runs in parallel with build & tests.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore SmartShop.slnx
      - name: Format check
        run: dotnet format SmartShop.slnx --verify-no-changes --no-restore --severity error

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Helm lint & render
        run: |
          helm lint deploy/helm/smartshop
          helm template ci deploy/helm/smartshop --set api.autoscaling.enabled=true > /dev/null
      - name: Compose config
        working-directory: deploy
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.observability.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.behind-proxy.yml -f docker-compose.small.yml config -q

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Reject copyleft / commercial NuGet licenses
        run: bash scripts/check-licenses.sh
