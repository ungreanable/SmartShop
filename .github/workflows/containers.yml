name: Containers

# Runs the full CI first; only when it passes, builds multi-arch images with the .NET SDK container support
# (no Dockerfiles) and pushes them to GHCR: main -> :edge + :sha-xxxxxxx, tag v1.2.3 -> :1.2.3 + :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Hosts/SmartShop.Api/SmartShop.Api.csproj
          - src/Hosts/SmartShop.Worker/SmartShop.Worker.csproj
          - src/Clients/SmartShop.Web/SmartShop.Web.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags="$tags;$version;latest"
          else
            tags="$tags;edge"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds linux-x64 and linux-arm64 one after the other, then creates multi-arch tags.
      - name: Publish container
        shell: bash
        run: |
          name="$(basename "${{ matrix.project }}" .csproj | tr '[:upper:]' '[:lower:]' | sed 's/\./-/g')"
          bash scripts/publish-multiarch.sh "${{ matrix.project }}" ghcr.io "${{ github.repository_owner }}/$name" "${{ steps.tags.outputs.tags }}"
