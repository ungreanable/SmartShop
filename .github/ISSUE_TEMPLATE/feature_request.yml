name: Feature request
description: Suggest an idea for village shops
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does this solve?
      description: Describe the situation in the village (customer, shop owner or admin).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
